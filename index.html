<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор стоимости услуги</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calculator">
        <h1>Калькулятор стоимости услуги</h1>
        
        <div class="form-group">
            <label for="quantity">Количество:</label>
            <input type="number" id="quantity" name="quantity" value="1" min="1">
        </div>

        <div class="form-group">
            <label>Тип услуги:</label>
            <div class="radio-group">
                <label>
                    <input type="radio" name="serviceType" value="1" checked>
                    Базовая услуга
                </label>
                <label>
                    <input type="radio" name="serviceType" value="2">
                    Расширенная услуга
                </label>
                <label>
                    <input type="radio" name="serviceType" value="3">
                    Премиум услуга
                </label>
            </div>
        </div>

        <div class="form-group hidden" id="optionsGroup">
            <label for="serviceOption">Опция услуги:</label>
            <select id="serviceOption" name="serviceOption">
                <option value="standard">Стандартная опция</option>
                <option value="express">Экспресс-опция</option>
                <option value="vip">VIP опция</option>
            </select>
        </div>

        <div class="form-group hidden" id="propertiesGroup">
            <label>Дополнительные свойства:</label>
            <div class="checkbox-group">
                <label>
                    <input type="checkbox" name="property" value="support">
                    Техническая поддержка
                </label>
                <label>
                    <input type="checkbox" name="property" value="consulting">
                    Консультация специалиста
                </label>
                <label>
                    <input type="checkbox" name="property" value="priority">
                    Приоритетное обслуживание
                </label>
            </div>
        </div>

        <div class="price-display" id="priceDisplay">
            Общая стоимость: 0 рублей
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
